{% extends "base.html" %}

{% block title %}Add Schedule - Admin - Qetero Booking{% endblock %}

{% block content %}
<div class="page-header">
    <a href="{{ url_for('admin.doctor_schedules', doctor_id=doctor.id) }}" class="btn btn-secondary">← Back to Schedule</a>
    <h1>Add/Update Schedule for Dr. {{ doctor.first_name }} {{ doctor.last_name }}</h1>
</div>

<div class="form-container">
    <form method="POST" action="{{ url_for('admin.add_schedule', doctor_id=doctor.id) }}" class="main-form">
        <div class="form-group">
            <label for="day_of_week">Day of Week *</label>
            <select id="day_of_week" name="day_of_week" required>
                <option value="">Select a day</option>
                {% for day in days %}
                <option value="{{ loop.index0 }}">{{ day }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="start_time">Start Time *</label>
            <input 
                type="time" 
                id="start_time" 
                name="start_time" 
                required
            >
        </div>

        <div class="form-group">
            <label for="end_time">End Time *</label>
            <input 
                type="time" 
                id="end_time" 
                name="end_time" 
                required
            >
        </div>

        <div class="form-group">
            <label class="checkbox-label">
                <input 
                    type="checkbox" 
                    id="is_available" 
                    name="is_available" 
                    checked
                >
                <span>Available</span>
            </label>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Schedule</button>
            <a href="{{ url_for('admin.doctor_schedules', doctor_id=doctor.id) }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
